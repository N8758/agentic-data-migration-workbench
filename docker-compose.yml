services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: migration_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: migration_frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped